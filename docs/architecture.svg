    <text x="784" y="140" fill="#4A5F78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ledger.db, audit.db</text>
    <text x="784" y="152" fill="#4A5F78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hash-chained, WAL</text>
    <rect x="480" y="264" width="152" height="64" rx="6" fill="#F5F5F5"/>
    <rect x="480" y="264" width="152" height="64" rx="6" fill="#FFFFFF" stroke="rgba(10,37,64,0.85)" stroke-width="1"/>
