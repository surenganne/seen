    <text x="340" y="140" fill="#4A5F78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stdlib only, fails open</text>
    <text x="340" y="152" fill="#4A5F78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spool/*.jsonl</text>
    <rect x="480" y="96" width="152" height="64" rx="6" fill="#F5F5F5"/>
    <rect x="480" y="96" width="152" height="64" rx="6" fill="#FFFFFF" stroke="rgba(10,37,64,0.85)" stroke-width="1"/>
    <text x="556" y="124" fill="#0A2540" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest</text>
    <text x="556" y="140" fill="#4A5F78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">at Stop: git delta, cost</text>
    <text x="556" y="152" fill="#4A5F78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PII scan, policy results</text>
    <rect x="696" y="96" width="176" height="64" rx="6" fill="#F5F5F5"/>
    <rect x="696" y="96" width="176" height="64" rx="6" fill="rgba(232,93,38,0.12)" stroke="#E85D26" stroke-width="1"/>
