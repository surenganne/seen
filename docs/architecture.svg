<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Seen architecture</title>
  <desc id="architecture-desc">Claude Code hooks write to a local ledger and audit database; a host dashboard reads it live, a Docker dashboard reads a snapshot copy, an opt-in team server receives metadata, and the CLI purges data and upgrades the plugin.</desc>
  <defs>
