[project]
name = "seen-core"
version = "0.1.0"
description = "Seen core: ledger, audit, memory, skills, PII"
requires-python = ">=3.11"
dependencies = ["sqlalchemy==2.1.5", "alembic==1.20.0", "pathspec==1.1.1", "pyyaml==6.0.3", "tomli-w==1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seen_core"]
