[project]
name = "seen-team"
version = "0.1.0"
description = "Seen team server (Phase 5)"
requires-python = ">=3.11"
dependencies = ["seen-core", "fastapi==0.146.0", "uvicorn==0.54.0", "psycopg[binary]==3.3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seen_team"]

[tool.uv.sources]
seen-core = { workspace = true }
