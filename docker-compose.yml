# Seen local stack. Ports avoid common defaults (47821 API+dashboard, 47822 Vite).
#   seen docker-sync && docker compose up -d   dashboard on your REAL data  http://127.0.0.1:47821
#   seen docker-sync --watch 300 --restart      keep it near-live (host loop; snapshot, then restart the dashboard)
#   docker compose --profile dev up -d          + Vite dev server (HMR)     http://127.0.0.1:47822
#   docker compose --profile test run --rm tests            Python lint/type/unit suite in a container
#   docker compose --profile test run --rm e2e              Playwright against a throwaway seeded test DB
# The container never opens the live ~/.seen: SQLite WAL locking does not cross the Docker Desktop VM (ADR 0008).
# It serves a consistent snapshot in ~/.seen-docker (ADR 0011). Mock data (SEEN_DEV_SEED) is for the test stacks only.
# Writes made in the container dashboard (settings, skill approvals) go to the snapshot and are lost on refresh;
# change those on the host dashboard (`seen serve`).
name: seen

services:
  dashboard:
    build: { context: ., target: app }
    image: seen-dashboard:dev
    environment:
      SEEN_HOME: /snap/current
      SEEN_ALLOWED_HOSTS: dashboard
    volumes: ["${SEEN_SNAPSHOT_DIR:-${HOME}/.seen-docker}:/snap"]
    ports: ["127.0.0.1:47821:47821"]
    restart: unless-stopped

  web-dev:
    profiles: [dev]
    image: node:22.20.0-alpine
    working_dir: /web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      SEEN_API: http://dashboard:47821
      SEEN_DEV_HOST: 0.0.0.0
    volumes: [./web:/web, seen-web-node-modules:/web/node_modules]
    ports: ["127.0.0.1:47822:47822"]
    depends_on: { dashboard: { condition: service_healthy } }

  tests:
    profiles: [test]
    build: { context: ., target: test }
    image: seen-tests:dev
    tmpfs: ["/tmp:exec"]
    # Latency gates (-m perf) run on the host and in the native CI job, where hooks really run;
    # container process start times say nothing about them.
    command: ["sh", "-c", "ruff check . && mypy packages/core/src && python scripts/gen_openapi.py --check && pytest -m 'not e2e and not pg and not perf'"]

  # Isolated test database: tmpfs, seeded fresh on every start, never the dev or real data.
  dashboard-test:
    profiles: [test]
    image: seen-dashboard:dev
    build: { context: ., target: app }
    environment:
      SEEN_HOME: /data
      SEEN_DEV_SEED: "1"
      SEEN_ALLOWED_HOSTS: dashboard-test
    tmpfs: ["/data:uid=10001,mode=0700"]

  e2e:
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /web
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"
    environment:
      SEEN_E2E_URL: http://dashboard-test:47821
      CI: "1"
    volumes: [./web:/web, seen-e2e-node-modules:/web/node_modules]
    depends_on: { dashboard-test: { condition: service_healthy } }

volumes:
  seen-web-node-modules:
  seen-e2e-node-modules:
