[project]
name = "seen-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["seen-core", "seen-cli", "seen-local", "seen-team"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
seen-core = { workspace = true }
seen-cli = { workspace = true }
seen-local = { workspace = true }
seen-team = { workspace = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.170.1", "ruff==0.17.1", "mypy==2.4.0", "httpx==0.28.1", "types-PyYAML==6.0.12.20260906"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -m \"not e2e and not pg\""
markers = ["e2e: needs a real Claude Code session (manual or nightly)", "pg: needs the Postgres test container",
           "perf: host latency gate (hooks run on the developer machine); skipped in containers"]

[tool.ruff]
line-length = 110
extend-exclude = ["spikes"]
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105"]
[tool.ruff.lint.isort]
known-first-party = ["seen_core", "seen_cli", "seen_local", "seen_team", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "seen_core.*"
strict = true
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query", "fastapi.Depends"]
